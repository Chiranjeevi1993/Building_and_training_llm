name: Train

on:
  workflow_dispatch:
    inputs:
      config:
        description: "Path to config YAML under configs/"
        required: true
        default: "configs/gpt2_small_tinystories.yaml"
      cluster:
        description: "AML compute cluster target"
        required: true
        type: choice
        options: [gpu-a100, gpu-a100-x4, gpu-t4-x4]
        default: gpu-a100
      run_name:
        description: "AML job display name"
        required: true
        default: "minigpt-run"

permissions:
  id-token: write
  contents: read

concurrency:
  group: minigpt-train-${{ inputs.cluster }}
  cancel-in-progress: false

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: az extension add -n ml -y

      - name: Build and push training image
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}
          docker build -f docker/Dockerfile.train -t ${{ secrets.ACR_NAME }}.azurecr.io/minigpt-train:${{ github.sha }} .
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/minigpt-train:${{ github.sha }}

      - name: Submit AML job
        run: |
          az ml job create \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --workspace-name ${{ secrets.AML_WORKSPACE }} \
            --name "${{ inputs.run_name }}-${{ github.run_number }}" \
            --set compute="azureml:${{ inputs.cluster }}" \
                  environment.image="${{ secrets.ACR_NAME }}.azurecr.io/minigpt-train:${{ github.sha }}" \
                  command="python3 -m minigpt.data.prepare --config ${{ inputs.config }} && python3 -m minigpt.train --config ${{ inputs.config }}" \
            --stream
