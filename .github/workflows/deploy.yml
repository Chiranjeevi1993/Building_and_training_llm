name: Deploy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push serve image
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}
          docker build -f docker/Dockerfile.serve -t ${{ secrets.ACR_NAME }}.azurecr.io/minigpt-serve:${{ github.sha }} .
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/minigpt-serve:${{ github.sha }}

      - name: Update Container App revision
        run: |
          az containerapp update \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image ${{ secrets.ACR_NAME }}.azurecr.io/minigpt-serve:${{ github.sha }}

      - name: Wait for revision health
        run: sleep 30

      - name: Smoke test
        run: |
          FQDN=$(az containerapp show --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn -o tsv)
          curl -sf "https://$FQDN/healthz"
          curl -sf -X POST "https://$FQDN/generate" \
            -H "Content-Type: application/json" \
            -d '{"prompt":"Once upon a time","max_new_tokens":20}'
